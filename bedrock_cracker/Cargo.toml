[package]
name = "bedrock_cracker"
version = "0.2.5"
edition = "2021"

[features]
default = []
tokio = ["dep:tokio"]
jni = ["dep:jni"]

[dependencies]
next_long_reverser = "0.1.0"
java_random = "0.1.7"
tokio = { version = "1.38", optional = true }
jni = { version = "0.21", optional = true }

[lib]
crate-type = ["rlib", "cdylib"]